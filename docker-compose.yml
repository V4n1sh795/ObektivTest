services:
  api:
    build:
      context: ./apiservice
      dockerfile: Dockerfile
      args:
        # Замени на имя DLL твоего проекта
        ENTRY_ASSEMBLY: MyMinimalApi.dll

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Deb

      ConnectionStrings__DefaultConnection: "Data Source=/data/app.db"
    volumes:
      - ./data:/data

    restart: unless-stopped

volumes:
  sqlite-data: